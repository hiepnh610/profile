<polyline class="edge" data-from="DEV" data-to="ADG2" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="if primary is unreachable" points="485.66666666666663,76.9 485.66666666666663,112.9 560.775,112.9 560.775,193.2" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
