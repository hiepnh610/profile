in SFP cage" data-shape="rectangle">
  <rect x="278.65" y="271.1" width="127.74999999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="342.525" y="298" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="342.525" dy="-3.9000000000000012">DFP-34X-2C2</tspan><tspan x="342.525" dy="16.900000000000002">in SFP cage</tspan></text>
</g>
<g class="node" data-id="RTR2" data-label="MikroTik
PPPoE" data-shape="rectangle">
  <rect x="454.4" y="271.1" width="108.25" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="508.525" y="298" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="508.525" dy="-3.9000000000000012">MikroTik</tspan><tspan x="508.525" dy="16.900000000000002">PPPoE</tspan></text>
</g>
</svg>