<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 733 396" width="733" height="396" style="--bg:var(--paper);--fg:var(--ink);--accent:var(--link)">
<style>
  
  text { font-family: 'iA Writer Duospace', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="before" data-label="Before">
  <rect x="40" y="40" width="653" height="144" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="653" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Before</text>
</g>
<g class="subgraph" data-id="after" data-label="After">
  <rect x="40" y="212" width="538.65" height="144" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="212" width="538.65" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="226" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">After</text>
</g>
<polyline class="edge" data-from="OLT1" data-to="ONT" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="fibre" points="140,126 278.65,126" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="ONT" data-to="RTR1" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="ethernet" points="410.29999999999995,126 568.75,126" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="OLT2" data-to="SFP" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="fibre" points="140,298 278.65,298" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="SFP" data-to="RTR2" data-style="solid" data-arrow-start="false" data-arrow-end="false" points="406.4,298 454.4,298" fill="none" stroke="var(--_line)" stroke-width="1" />
<g class="edge-label" data-from="OLT1" data-to="ONT" data-label="fibre">
  <rect x="184" y="110" width="50.65" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="209.325" y="125.15" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">fibre</text>
</g>
<g class="edge-label" data-from="ONT" data-to="RTR1" data-label="ethernet">
  <rect x="454.29999999999995" y="110" width="70.44999999999999" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
