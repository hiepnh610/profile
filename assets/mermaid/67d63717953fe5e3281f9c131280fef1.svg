  <text x="344.47499999999997" y="126" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="344.47499999999997" dy="-3.9000000000000012">ISP ONT</tspan><tspan x="344.47499999999997" dy="16.900000000000002">bridge mode</tspan></text>
</g>
