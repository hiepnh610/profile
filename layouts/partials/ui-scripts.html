<script>
  // Search modal
  (function () {
    var modal = document.getElementById('search-modal');
    var btn = document.getElementById('search-btn');
    var input = document.getElementById('modal-input');
    var results = document.getElementById('modal-results');
    var hint = document.getElementById('modal-hint');
    var fuse = null;
    var loaded = false;

    function openModal() {
      modal.showModal();
      input.focus();
      if (!loaded) loadData();
    }

    function closeModal() {
      modal.close();
    }

    modal.addEventListener('close', function () {
      input.value = '';
      results.innerHTML = '';
      hint.style.display = '';
      hint.textContent = 'Type to search';
    });

    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    btn.addEventListener('click', openModal);

    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        modal.open ? closeModal() : openModal();
      }
    });

    var timer;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(doSearch, 150);
    });

    function doSearch() {
      var q = input.value.trim();
      if (!q || !fuse) {
        results.innerHTML = '';
        hint.style.display = '';
        hint.textContent = !fuse && q ? 'Loading index…' : 'Type to search';
        return;
      }
      var hits = fuse.search(q, { limit: 8 });
      if (!hits.length) {
        results.innerHTML = '';
        hint.style.display = '';
        hint.textContent = 'No results for "' + q + '"';
        return;
      }
      hint.style.display = 'none';
      var frag = document.createDocumentFragment();
      hits.forEach(function (r) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = r.item.permalink;
        var t = document.createElement('div');
        t.className = 'res-title';
        t.textContent = r.item.title;
        a.appendChild(t);
        if (r.item.summary) {
          var s = document.createElement('div');
          s.className = 'res-summary';
          s.textContent = r.item.summary
            .replace(/<[^>]+>/g, '')
            .substring(0, 120);
          a.appendChild(s);
        }
        li.appendChild(a);
        frag.appendChild(li);
      });
      results.innerHTML = '';
      results.appendChild(frag);
    }

    async function loadData() {
      hint.textContent = 'Loading…';
      try {
        var res = await fetch('/index.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        loaded = true;
        var poll = setInterval(function () {
          if (typeof Fuse !== 'undefined') {
            clearInterval(poll);
            fuse = new Fuse(data, {
              isCaseSensitive: false,
              shouldSort: true,
              location: 0,
              distance: 1000,
              threshold: 0.4,
              minMatchCharLength: 2,
              keys: ['title', 'permalink', 'summary', 'content'],
            });
            hint.textContent = 'Type to search';
            if (input.value.trim()) doSearch();
          }
        }, 30);
      } catch (e) {
        hint.textContent = 'Search unavailable';
        console.error('Search:', e);
      }
    }
  })();

  // Theme toggle
  (function () {
    var html = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;

    function isDark() {
      var t = html.getAttribute('data-theme');
      if (t === 'dark') return true;
      if (t === 'light') return false;
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function updateLabel() {
      btn.setAttribute(
        'aria-label',
        isDark() ? 'Switch to light mode' : 'Switch to dark mode',
      );
    }

    updateLabel();

    btn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      html.setAttribute('data-theme', next);
      updateLabel();
    });
  })();
</script>
