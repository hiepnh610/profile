<style>
  /* ── Design tokens ── */
  :root {
    --ink: #333333;
    --head: #111111;
    --paper: #f8f8f6;
    --muted: #666666;
    --quiet: #999999;
    --rule: #cccccc;
    --rule-2: #e9e9e5;
    --link: #006fd0;
    --code-bg: #e6e6e2;
    --topbar-bg: rgba(248, 248, 246, 0.92);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ink: #c9c9c4;
      --head: #ededea;
      --paper: #1b1b19;
      --muted: #999999;
      --quiet: #6e6e6a;
      --rule: #3d3d39;
      --rule-2: #262624;
      --link: #58a6ff;
      --code-bg: #2a2a27;
      --topbar-bg: rgba(27, 27, 25, 0.92);
    }
  }

  :root[data-theme='dark'] {
    --ink: #c9c9c4;
    --head: #ededea;
    --paper: #1b1b19;
    --muted: #999999;
    --quiet: #6e6e6a;
    --rule: #3d3d39;
    --rule-2: #262624;
    --link: #58a6ff;
    --code-bg: #2a2a27;
    --topbar-bg: rgba(27, 27, 25, 0.92);
  }

  /* ── Reset ── */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'iA Writer Duospace', 'Courier New', monospace;
    font-size: 16px;
    line-height: 1.7;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--topbar-bg);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--rule);
  }

  .topbar-inner {
    max-width: 44rem;
    margin: 0 auto;
    padding: 12px 1rem;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
  }

  .topbar-right {
    display: flex;
    justify-content: flex-end;
  }

  .topnav {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    list-style: none;
  }

  .topnav a {
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    transition: color 150ms ease;
  }

  .topnav a:hover,
  .topnav a.active {
    color: var(--head);
    text-decoration: none;
  }

  .topnav a.active {
    font-weight: 700;
  }

  .icon-ms {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 1.125em;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    vertical-align: -0.2em;
    font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24;
    -webkit-font-smoothing: antialiased;
  }

  .search-btn {
    font-family: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 4px 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 150ms;
  }

  .search-btn .icon-ms {
    font-size: 16px;
    vertical-align: middle;
  }

  .search-btn:hover {
    color: var(--head);
  }

  .search-btn.pulse {
    animation: pulse-scale 250ms ease;
  }

  .theme-toggle {
    font-size: 15px;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 150ms;
  }

  .theme-toggle .icon-ms {
    font-size: 18px;
    vertical-align: middle;
  }

  .theme-toggle:hover {
    color: var(--ink);
  }

  @keyframes pulse-scale {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.06);
    }
    100% {
      transform: scale(1);
    }
  }

  /* ── Page wrapper: single narrow column ── */
  .page {
    max-width: 44rem;
    margin: 0 auto;
    padding: 2.5rem 1rem 4rem;
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Focus rings ── */
  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ── Search modal ── */
  #search-modal {
    border: 1px solid var(--rule);
    padding: 0;
    width: min(560px, calc(100vw - 32px));
    max-height: 70vh;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.14);
    position: fixed;
    top: 80px;
    margin: 0 auto;
  }

  #search-modal::backdrop {
    background: rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }

  .modal-box {
    display: flex;
    flex-direction: column;
    max-height: 70vh;
  }

  #modal-input {
    font-family: inherit;
    font-size: 16px;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 18px 20px;
    outline: none;
    background: transparent;
    color: var(--ink);
    width: 100%;
    -webkit-appearance: none;
  }

  #modal-input::placeholder {
    color: var(--quiet);
  }

  #modal-results {
    list-style: none;
    overflow-y: auto;
    flex: 1;
  }

  #modal-results li a {
    display: block;
    padding: 12px 20px;
    border-bottom: 1px solid var(--rule-2);
    text-decoration: none;
    color: var(--ink);
  }

  #modal-results li a:hover,
  #modal-results li a:focus {
    background: var(--rule-2);
    outline: none;
  }

  .res-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--link);
    margin-bottom: 2px;
  }

  .res-summary {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #modal-hint {
    font-family: inherit;
    font-size: 12px;
    color: var(--quiet);
    padding: 14px 20px;
    margin: 0;
  }
</style>
