{{- /* Colors for inlined Archify SVGs (see shortcodes/archify.html). Included
     once by layouts/single.html when the page uses the archify shortcode. */ -}}
<style>
  /* Archify palette (its "classic" preset) on top of the site's neutrals.
     Neutral roles map to site tokens; the seven semantic hues are Archify's
     own light/dark values so node types stay recognisable. */
  svg[data-archify] {
    --text: var(--head);
    --text-muted: var(--muted);
    --mask: var(--paper);
    --arrow: var(--quiet);
    --arrow-emphasis: var(--link);
    --frontend-fill: rgba(34, 211, 238, 0.15);
    --frontend-stroke: #0891b2;
    --backend-fill: rgba(52, 211, 153, 0.18);
    --backend-stroke: #059669;
    --database-fill: rgba(167, 139, 250, 0.2);
    --database-stroke: #7c3aed;
    --cloud-fill: rgba(251, 191, 36, 0.18);
    --cloud-stroke: #d97706;
    --security-fill: rgba(251, 113, 133, 0.15);
    --security-stroke: #e11d48;
    --messagebus-fill: rgba(251, 146, 60, 0.15);
    --messagebus-stroke: #ea580c;
    --external-fill: rgba(148, 163, 184, 0.18);
    --external-stroke: #64748b;
    --region-fill: transparent; /* label masks are paper-colored; a tinted region would show them as boxes */
    font-family: inherit;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) svg[data-archify] {
      --frontend-fill: rgba(8, 51, 68, 0.4);
      --frontend-stroke: #22d3ee;
      --backend-fill: rgba(6, 78, 59, 0.4);
      --backend-stroke: #34d399;
      --database-fill: rgba(76, 29, 149, 0.4);
      --database-stroke: #a78bfa;
      --cloud-fill: rgba(120, 53, 15, 0.3);
      --cloud-stroke: #fbbf24;
      --security-fill: rgba(136, 19, 55, 0.4);
      --security-stroke: #fb7185;
      --messagebus-fill: rgba(251, 146, 60, 0.3);
      --messagebus-stroke: #fb923c;
      --external-fill: rgba(30, 41, 59, 0.5);
      --external-stroke: #94a3b8;
    }
  }

  :root[data-theme='dark'] svg[data-archify] {
    --frontend-fill: rgba(8, 51, 68, 0.4);
    --frontend-stroke: #22d3ee;
    --backend-fill: rgba(6, 78, 59, 0.4);
    --backend-stroke: #34d399;
    --database-fill: rgba(76, 29, 149, 0.4);
    --database-stroke: #a78bfa;
    --cloud-fill: rgba(120, 53, 15, 0.3);
    --cloud-stroke: #fbbf24;
    --security-fill: rgba(136, 19, 55, 0.4);
    --security-stroke: #fb7185;
    --messagebus-fill: rgba(251, 146, 60, 0.3);
    --messagebus-stroke: #fb923c;
    --external-fill: rgba(30, 41, 59, 0.5);
    --external-stroke: #94a3b8;
  }

  /* Components */
  svg[data-archify] .c-mask { fill: var(--mask); stroke: none; }
  svg[data-archify] .c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
  svg[data-archify] .c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
  svg[data-archify] .c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
  svg[data-archify] .c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
  svg[data-archify] .c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
  svg[data-archify] .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
  svg[data-archify] .c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
  svg[data-archify] .c-region { fill: var(--region-fill); stroke: var(--cloud-stroke); stroke-dasharray: 8,4; }

  /* Text */
  svg[data-archify] .t-primary { fill: var(--text); }
  svg[data-archify] .t-muted { fill: var(--text-muted); }
  svg[data-archify] .t-frontend { fill: var(--frontend-stroke); }
  svg[data-archify] .t-backend { fill: var(--backend-stroke); }
  svg[data-archify] .t-database { fill: var(--database-stroke); }
  svg[data-archify] .t-cloud { fill: var(--cloud-stroke); }
  svg[data-archify] .t-security { fill: var(--security-stroke); }
  svg[data-archify] .t-messagebus { fill: var(--messagebus-stroke); }
  svg[data-archify] .t-external { fill: var(--external-stroke); }

  /* Role sigils in the node corner */
  svg[data-archify] .semantic-sigil { fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; }
  svg[data-archify] .semantic-sigil > * { vector-effect: non-scaling-stroke; }
  svg[data-archify] .semantic-sigil .sigil-fill { fill: currentColor; stroke: none; }
  svg[data-archify] .s-frontend { color: var(--frontend-stroke); }
  svg[data-archify] .s-backend { color: var(--backend-stroke); }
  svg[data-archify] .s-database { color: var(--database-stroke); }
  svg[data-archify] .s-cloud { color: var(--cloud-stroke); }
  svg[data-archify] .s-security { color: var(--security-stroke); }
  svg[data-archify] .s-messagebus { color: var(--messagebus-stroke); }
  svg[data-archify] .s-external { color: var(--external-stroke); }

  /* Connections + arrowheads */
  svg[data-archify] .a-default { stroke: var(--arrow); fill: none; }
  svg[data-archify] .a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
  svg[data-archify] .a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5,5; }
  svg[data-archify] .a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4,4; }
  svg[data-archify] .m-default { fill: var(--arrow); }
  svg[data-archify] .m-emphasis { fill: var(--arrow-emphasis); }
  svg[data-archify] .m-security { fill: var(--security-stroke); }
  svg[data-archify] .m-dashed { fill: var(--database-stroke); }
</style>
