<dialog id="search-modal" aria-label="Search posts">
  <div class="modal-box">
    <input
      type="search"
      id="modal-input"
      placeholder="Search posts…"
      autocomplete="off"
      spellcheck="false"
      maxlength="64"
      aria-label="Search"
    />
    <ul id="modal-results" role="listbox" aria-label="Results"></ul>
    <p id="modal-hint">Type to search</p>
  </div>
</dialog>
