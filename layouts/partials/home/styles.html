    text-underline-offset: 2px;
  }

  }

    color: var(--head);
  }

  .featured-meta {
    font-size: 13px;

    margin-bottom: 10px;
  }

  .featured-dek {
    color: var(--muted);
    margin-bottom: 10px;
  }

    list-style: none;

    transition: color 150ms;

    text-decoration: underline;
  }

  .filter-tabs button.active {

    gap: 12px;

    font-weight: 700;
    color: var(--link);
  }

    text-decoration: underline;
  }

    margin-left: 4px;
    color: var(--quiet);
    font-size: 15px;

    vertical-align: 0.05em;
  }

    text-transform: lowercase;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    white-space: nowrap;
  }

    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

    background: #16a34a;
  }

    background: #d97706;
  }

    animation: livepulse 2s ease-in-out infinite;
  }

  a.project[data-status='shelved'] .pip {
    background: var(--quiet);
  }

    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.45;
    }
  }

    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    text-wrap: pretty;
  }

    align-items: center;
    justify-content: space-between;
