<style>
  :root {
    --ink: #0c0c0c;
    --paper: #ffffff;
    --muted: #6f6f6f;
    --quiet: #a3a3a3;
    --rule: #ececec;
    --rule-2: #f6f6f6;
    --topbar-bg: rgba(255, 255, 255, 0.85);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ink: #ebebeb;
      --paper: #111111;
      --muted: #909090;
      --quiet: #5e5e5e;
      --rule: #272727;
      --rule-2: #1c1c1c;
      --topbar-bg: rgba(17, 17, 17, 0.85);
    }
  }

  :root[data-theme='dark'] {
    --ink: #ebebeb;
    --paper: #111111;
    --muted: #909090;
    --quiet: #5e5e5e;
    --rule: #272727;
    --rule-2: #1c1c1c;
    --topbar-bg: rgba(17, 17, 17, 0.85);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family:
      'Geist',
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--topbar-bg);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--rule);
  }

  .topbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px clamp(20px, 4vw, 48px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }

  .topbar-right {
    display: flex;
    justify-content: flex-end;
  }

  .topnav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-wrap: wrap;
    list-style: none;
  }

  .topnav a {
    font-size: 13px;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 999px;
    transition:
      color 150ms ease,
      background 150ms ease;
    white-space: nowrap;
  }

  .topnav a:hover,
  .topnav a.active {
    color: var(--ink);
    background: var(--rule-2);
  }

  .icon-ms {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 1.125em;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    vertical-align: -0.2em;
    font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24;
    -webkit-font-smoothing: antialiased;
  }

  .search-btn {
    font-family: 'Geist Mono', 'Courier New', monospace;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 5px 32px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition:
      border-color 150ms,
      color 150ms;
  }

  .search-btn .icon-ms {
    font-size: 16px;
    vertical-align: middle;
  }

  .search-btn:hover {
    color: var(--ink);
    border-color: var(--quiet);
  }

  .search-btn.pulse {
    animation: pulse-scale 250ms ease;
  }

  .theme-toggle {
    font-size: 15px;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 150ms;
  }

  .theme-toggle .icon-ms {
    font-size: 18px;
    vertical-align: middle;
  }

  .theme-toggle:hover {
    color: var(--ink);
  }

  @keyframes pulse-scale {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.06);
    }
    100% {
      transform: scale(1);
    }
  }

  /* ── Page wrapper ── */
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(28px, 4vw, 56px) clamp(20px, 4vw, 48px);
  }

  /* ── Main grid ── */
  .main-grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: clamp(40px, 6vw, 88px);
    align-items: start;
  }

  /* ── Sidebar ── */
  .intro {
    position: sticky;
    top: 96px;
  }

  .who {
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-size: clamp(34px, 3.6vw, 44px);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin-bottom: 20px;
  }

  .who em {
    font-style: italic;
    color: var(--muted);
  }

  .bio {
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    margin-bottom: 20px;
  }

  .bio .q {
    color: var(--muted);
  }

  .bio a {
    color: var(--muted);
    border-bottom: 1px solid var(--rule);
    transition:
      border-color 150ms,
      color 150ms;
  }

  .bio a:hover {
    color: var(--ink);
    border-color: var(--ink);
  }

  /* ── Socials ── */
  .socials {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    list-style: none;
  }

  .socials a {
    font-size: 13px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 11px;
    color: var(--ink);
    transition:
      background 150ms,
      color 150ms,
      border-color 150ms,
      transform 150ms;
    white-space: nowrap;
  }

  .socials a:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    transform: translateY(-1px);
  }

  /* ── Stats ── */
  .stats {
    border-top: 1px solid var(--rule);
    padding-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 12px;
    list-style: none;
  }

  .stats dt {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--quiet);
    margin-bottom: 4px;
  }

  .stats dd {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }

  /* ── Feed ── */
  .feed {
  }

  /* ── Featured card ── */
  .featured-card {
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 26px 28px 24px;
    background: linear-gradient(
      180deg,
      var(--rule-2) 0%,
      var(--paper) 100%
    );
    position: relative;
    margin-bottom: 36px;
    transition: border-color 200ms ease;
    display: block;
  }

  .featured-card:hover {
    border-color: var(--quiet);
  }

  .featured-label {
    position: absolute;
    top: 20px;
    right: 20px;
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--quiet);
  }

  .featured-label::before {
    content: '★ ';
  }

  .featured-meta {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--quiet);
    margin-bottom: 12px;
  }

  .featured-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(24px, 2.4vw, 30px);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .featured-dek {
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .featured-read {
    font-size: 14px;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .featured-read u {
    text-underline-offset: 3px;
  }

  .featured-arrow {
    display: inline-block;
    transition: transform 250ms ease;
  }

  .featured-card:hover .featured-arrow {
    transform: translateX(3px);
  }

  /* ── Section header ── */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--quiet);
  }

  .filter-tabs {
    display: flex;
    gap: 2px;
    align-items: center;
    list-style: none;
    role: tablist;
  }

  .filter-tabs button {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    padding: 4px 8px;
    border: none;
    background: transparent;
    color: var(--quiet);
    border-radius: 4px;
    cursor: pointer;
    transition:
      color 150ms,
      background 150ms;
  }

  .filter-tabs button:hover {
    color: var(--ink);
  }

  .filter-tabs button.active {
    color: var(--ink);
    background: var(--rule-2);
  }

  /* ── Posts list ── */
  .posts {
    list-style: none;
    border-top: 1px solid var(--rule);
  }

  .post-item {
    border-bottom: 1px solid var(--rule-2);
  }

  .post {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 0 16px;
    align-items: start;
    padding: 18px 0 18px 0;
    transition: padding-left 200ms ease;
    color: inherit;
  }

  .post:hover {
    padding-left: 6px;
  }

  .post-date {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--quiet);
    padding-top: 3px;
  }

  .post-body {
  }

  .post-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--ink);
    background-image: linear-gradient(var(--ink), var(--ink));
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 0% 1px;
    transition: background-size 300ms ease;
    display: inline;
  }

  .post:hover .post-title {
    background-size: 100% 1px;
  }

  .post-dek {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 62ch;
    margin-top: 5px;
  }

  .post-tag {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--quiet);
    padding-top: 4px;
  }

  /* ── All-posts link ── */
  .all-posts-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 24px;
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    border: 1px dashed var(--rule);
    border-radius: 10px;
    padding: 10px 20px;
    transition:
      background 150ms,
      color 150ms;
  }

  .all-posts-link .icon-ms {
    font-size: 16px;
  }

  .all-posts-link:hover {
    background: var(--rule-2);
    color: var(--ink);
  }

  /* ── Side projects ── */
  .projects-section {
    margin-top: 56px;
  }

  .section-h {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }

  .section-h h3 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .section-h h3 .count {
    font-family: 'Geist Mono', monospace;
    font-weight: 400;
    color: var(--quiet);
    margin-left: 8px;
  }

  .section-h-caption {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--quiet);
  }

  ul.projects {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 700px) {
    ul.projects {
      grid-template-columns: 1fr;
    }
  }

  a.project {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 18px 20px 16px;
    background: var(--paper);
    color: inherit;
    transition:
      border-color 0.2s,
      transform 0.2s,
      background 0.2s;
  }

  a.project:hover {
    border-color: #cfcfcf;
    transform: translateY(-2px);
    background: linear-gradient(180deg, var(--rule-2) 0%, var(--paper) 70%);
  }

  a.project:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .project .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .project .name {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.005em;
  }

  .project .name .ext {
    display: inline-block;
    margin-left: 4px;
    color: var(--quiet);
    font-size: 17px;
    line-height: 1;
    vertical-align: 0.08em;
    transition:
      color 0.2s,
      transform 0.2s;
  }

  a.project:hover .name .ext {
    color: var(--ink);
    transform: translate(2px, -2px);
  }

  .project .status {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .project .pip {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  a.project[data-status='live'] .pip {
    background: #16a34a;
    box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
  }

  a.project[data-status='beta'] .pip {
    background: #d97706;
    box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.14);
  }

  a.project[data-status='wip'] .pip {
    background: var(--ink);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
    animation: livepulse 2s ease-in-out infinite;
  }

  a.project[data-status='shelved'] .pip {
    background: var(--quiet);
  }

  @keyframes livepulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.45;
    }
  }

  .project .dek {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--muted);
    text-wrap: pretty;
  }

  .project .foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 4px;
  }

  .project .stack {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    list-style: none;
  }

  .project .stack span {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    color: var(--quiet);
    border: 1px solid var(--rule);
    padding: 2px 7px;
    border-radius: 999px;
  }

  .project .year {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--quiet);
    white-space: nowrap;
  }

  /* ── Footer ── */
  .site-footer {
    border-top: 1px solid var(--rule);
    margin-top: clamp(28px, 4vw, 56px);
  }

  .footer-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px clamp(20px, 4vw, 48px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .footer-left {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--quiet);
  }

  .footer-right {
    display: flex;
    gap: 16px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
  }

  .footer-right a {
    color: var(--quiet);
    transition: color 150ms;
  }

  .footer-right a:hover {
    color: var(--ink);
  }

  /* ── Responsive ── */
  @media (max-width: 880px) {
    .main-grid {
      grid-template-columns: 1fr;
    }

    .intro {
      position: static;
    }
  }

  @media (max-width: 560px) {
    .post {
      grid-template-columns: 70px 1fr;
    }

    .post-tag {
      display: none;
    }
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Focus styles ── */
  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ── Search modal ── */
  #search-modal {
    border: none;
    border-radius: 14px;
    padding: 0;
    width: min(560px, calc(100vw - 32px));
    max-height: 70vh;
    overflow: hidden;
    background: var(--paper);
    box-shadow:
      0 12px 48px rgba(0, 0, 0, 0.14),
      0 0 0 1px var(--rule);
    position: fixed;
    top: 80px;
    margin: 0 auto;
  }

  #search-modal::backdrop {
    background: rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }

  .modal-box {
    display: flex;
    flex-direction: column;
    max-height: 70vh;
  }

  #modal-input {
    font-family: 'Geist', sans-serif;
    font-size: 16px;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 18px 20px;
    outline: none;
    background: transparent;
    color: var(--ink);
    width: 100%;
    -webkit-appearance: none;
  }

  #modal-input::placeholder {
    color: var(--quiet);
  }

  #modal-results {
    list-style: none;
    overflow-y: auto;
    flex: 1;
  }

  #modal-results li a {
    display: block;
    padding: 12px 20px;
    border-bottom: 1px solid var(--rule-2);
    text-decoration: none;
    color: var(--ink);
  }

  #modal-results li a:hover,
  #modal-results li a:focus {
    background: var(--rule-2);
    outline: none;
  }

  .res-title {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .res-summary {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #modal-hint {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--quiet);
    padding: 14px 20px;
    margin: 0;
  }
</style>
