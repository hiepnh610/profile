<style>
  :root {
    --ink: #333333;
    --head: #111111;
    --paper: #f8f8f6;
    --muted: #666666;
    --quiet: #999999;
    --rule: #cccccc;
    --rule-2: #e9e9e5;
    --link: #006fd0;
    --code-bg: #e6e6e2;
    --topbar-bg: rgba(248, 248, 246, 0.92);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ink: #c9c9c4;
      --head: #ededea;
      --paper: #1b1b19;
      --muted: #999999;
      --quiet: #6e6e6a;
      --rule: #3d3d39;
      --rule-2: #262624;
      --link: #58a6ff;
      --code-bg: #2a2a27;
      --topbar-bg: rgba(27, 27, 25, 0.92);
    }
  }

  :root[data-theme='dark'] {
    --ink: #c9c9c4;
    --head: #ededea;
    --paper: #1b1b19;
    --muted: #999999;
    --quiet: #6e6e6a;
    --rule: #3d3d39;
    --rule-2: #262624;
    --link: #58a6ff;
    --code-bg: #2a2a27;
    --topbar-bg: rgba(27, 27, 25, 0.92);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'iA Writer Duospace', 'Courier New', monospace;
    font-size: 16px;
    line-height: 1.7;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a {
    color: var(--link);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  hr {
    border: none;
    border-bottom: 1px solid var(--rule);
    margin: 2rem 0;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--topbar-bg);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--rule);
  }

  .topbar-inner {
    max-width: 44rem;
    margin: 0 auto;
    padding: 12px 1rem;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
  }

  .topbar-right {
    display: flex;
    justify-content: flex-end;
  }

  .topnav {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    list-style: none;
  }

  .topnav a {
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    transition: color 150ms ease;
  }

  .topnav a:hover,
  .topnav a.active {
    color: var(--head);
    text-decoration: none;
  }

  .topnav a.active {
    font-weight: 700;
  }

  .icon-ms {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 1.125em;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    vertical-align: -0.2em;
    font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24;
    -webkit-font-smoothing: antialiased;
  }

  .search-btn {
    font-family: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 4px 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 150ms;
  }

  .search-btn .icon-ms {
    font-size: 16px;
    vertical-align: middle;
  }

  .search-btn:hover {
    color: var(--head);
  }

  .search-btn.pulse {
    animation: pulse-scale 250ms ease;
  }

  .theme-toggle {
    font-size: 15px;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 4px 6px;
    cursor: pointer;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 150ms;
  }

  .theme-toggle .icon-ms {
    font-size: 18px;
    vertical-align: middle;
  }

  .theme-toggle:hover {
    color: var(--head);
  }

  @keyframes pulse-scale {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.06);
    }
    100% {
      transform: scale(1);
    }
  }

  /* ── Page wrapper: single narrow column ── */
  .page {
    max-width: 44rem;
    margin: 0 auto;
    padding: 2.5rem 1rem 4rem;
  }

  /* ── Intro ── */
  .who {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.2;
    color: var(--head);
    margin-bottom: 1rem;
  }

  .who em {
    font-style: normal;
    color: var(--muted);
  }

  .bio {
    margin-bottom: 1rem;
  }

  .bio .q {
    color: var(--muted);
  }

  .site-stats {
    font-size: 14px;
    color: var(--muted);
  }

  /* ── Featured ── */
  .featured-label {
    font-size: 12px;
    text-transform: lowercase;
    letter-spacing: 0.08em;
    color: var(--quiet);
    margin-bottom: 6px;
  }

  .featured-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: clamp(21px, 2.6vw, 26px);
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .featured-title a {
    color: var(--head);
  }

  .featured-meta {
    font-size: 13px;
    color: var(--quiet);
    margin-bottom: 10px;
  }

  .featured-dek {
    color: var(--muted);
    margin-bottom: 10px;
  }

  .featured-read {
    font-size: 15px;
  }

  /* ── Section header ── */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-transform: lowercase;
    color: var(--head);
  }

  .filter-tabs {
    display: flex;
    gap: 4px;
    align-items: center;
    list-style: none;
  }

  .filter-tabs button {
    font-family: inherit;
    font-size: 13px;
    padding: 2px 8px;
    border: none;
    background: transparent;
    color: var(--link);
    cursor: pointer;
    transition: color 150ms;
  }

  .filter-tabs button:hover {
    text-decoration: underline;
  }

  .filter-tabs button.active {
    color: var(--head);
    font-weight: 700;
    text-decoration: none;
  }

  /* ── Posts list ── */
  .posts {
    list-style: none;
  }

  .post-item {
    border-bottom: 1px solid var(--rule-2);
  }

  .post-item:last-child {
    border-bottom: none;
  }

  .post {
    display: grid;
    grid-template-columns: 88px 1fr auto;
    gap: 0 16px;
    align-items: start;
    padding: 14px 0;
    color: inherit;
  }

  .post:hover {
    text-decoration: none;
  }

  .post-date {
    font-size: 13px;
    color: var(--quiet);
    padding-top: 2px;
  }

  .post-title {
    font-weight: 700;
    color: var(--link);
    display: inline;
  }

  .post:hover .post-title {
    text-decoration: underline;
  }

  .post-dek {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 62ch;
    margin-top: 2px;
  }

  .post-tag {
    font-size: 12px;
    text-transform: lowercase;
    color: var(--quiet);
    padding-top: 3px;
  }

  /* ── All-posts link ── */
  .all-posts-link {
    display: inline-block;
    margin-top: 1rem;
    font-size: 15px;
  }

  /* ── Side projects ── */
  .projects-section {
    margin-top: 1rem;
  }

  .section-h {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .section-h h3 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-transform: lowercase;
    color: var(--head);
  }

  .section-h h3 .count {
    font-family: 'iA Writer Duospace', monospace;
    font-weight: 400;
    font-size: 13px;
    color: var(--quiet);
    margin-left: 6px;
  }

  .section-h-caption {
    font-size: 13px;
    color: var(--quiet);
  }

  ul.projects {
    list-style: none;
  }

  ul.projects > li {
    border-bottom: 1px solid var(--rule-2);
    padding: 14px 0;
  }

  ul.projects > li:last-child {
    border-bottom: none;
  }

  a.project {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: inherit;
  }

  a.project:hover {
    text-decoration: none;
  }

  .project .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .project .name {
    font-weight: 700;
    color: var(--link);
  }

  a.project:hover .name {
    text-decoration: underline;
  }

  .project .name .ext {
    display: inline-block;
    margin-left: 4px;
    color: var(--quiet);
    font-size: 15px;
    line-height: 1;
    vertical-align: 0.05em;
  }

  .project .status {
    font-size: 12px;
    text-transform: lowercase;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .project .pip {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  a.project[data-status='live'] .pip {
    background: #16a34a;
  }

  a.project[data-status='beta'] .pip {
    background: #d97706;
  }

  a.project[data-status='wip'] .pip {
    background: var(--ink);
    animation: livepulse 2s ease-in-out infinite;
  }

  a.project[data-status='shelved'] .pip {
    background: var(--quiet);
  }

  @keyframes livepulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.45;
    }
  }

  .project .dek {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    text-wrap: pretty;
  }

  .project .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .project .stack {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    list-style: none;
  }

  .project .stack span {
    font-size: 12px;
    color: var(--quiet);
  }

  .project .year {
    font-size: 12px;
    color: var(--quiet);
    white-space: nowrap;
  }

  /* ── Footer ── */
  .site-footer {
    border-top: 1px solid var(--rule);
  }

  .footer-inner {
    max-width: 44rem;
    margin: 0 auto;
    padding: 16px 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .footer-left {
    font-size: 13px;
    color: var(--quiet);
  }

  .footer-right {
    display: flex;
    gap: 16px;
    font-size: 13px;
  }

  .footer-right a {
    color: var(--quiet);
    transition: color 150ms;
  }

  .footer-right a:hover {
    color: var(--ink);
  }

  /* ── Responsive ── */
  @media (max-width: 560px) {
    .post {
      grid-template-columns: 70px 1fr;
    }

    .post-tag {
      display: none;
    }
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Focus styles ── */
  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* ── Search modal ── */
  #search-modal {
    border: 1px solid var(--rule);
    padding: 0;
    width: min(560px, calc(100vw - 32px));
    max-height: 70vh;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.14);
    position: fixed;
    top: 80px;
    margin: 0 auto;
  }

  #search-modal::backdrop {
    background: rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }

  .modal-box {
    display: flex;
    flex-direction: column;
    max-height: 70vh;
  }

  #modal-input {
    font-family: inherit;
    font-size: 16px;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 16px 20px;
    outline: none;
    background: transparent;
    color: var(--ink);
    width: 100%;
    -webkit-appearance: none;
  }

  #modal-input::placeholder {
    color: var(--quiet);
  }

  #modal-results {
    list-style: none;
    overflow-y: auto;
    flex: 1;
  }

  #modal-results li a {
    display: block;
    padding: 12px 20px;
    border-bottom: 1px solid var(--rule-2);
    text-decoration: none;
    color: var(--ink);
  }

  #modal-results li a:hover,
  #modal-results li a:focus {
    background: var(--rule-2);
    outline: none;
  }

  .res-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--link);
    margin-bottom: 2px;
  }

  .res-summary {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #modal-hint {
    font-size: 13px;
    color: var(--quiet);
    padding: 12px 20px;
    margin: 0;
  }
</style>
