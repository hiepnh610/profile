<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ site.Title }}</title>
<meta name="description" content="{{ site.Params.description }}" />
<link rel="icon" href="/images/favicon.svg" />
<link rel="canonical" href="{{ .Permalink }}" />
<link
  rel="alternate"
  type="application/rss+xml"
  title="{{ site.Title }}"
  href="/index.xml"
/>
{{ partial "head-assets.html" . }}
{{ partial "analytics.html" . }}
{{ partial "theme-init.html" . }}
{{ partial "styles-shared.html" . }}
{{ partial "home/styles.html" . }}
{{/* ── Open Graph / Social ── */}}
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:title" content="{{ site.Title }}" />
<meta property="og:description" content="{{ site.Params.description }}" />
<meta property="og:image" content="{{ "/images/og-default.jpg" | absURL }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ site.Title }}" />
<meta name="twitter:description" content="{{ site.Params.description }}" />
<meta name="twitter:image" content="{{ "/images/og-default.jpg" | absURL }}" />
{{/* ── Structured Data ── */}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.Title }}",
  "url": "{{ site.BaseURL }}",
  "description": "{{ site.Params.description }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{ site.BaseURL }}search/?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.BaseURL }}#person",
  "name": "{{ site.Params.author }}",
  "url": "{{ site.BaseURL }}",
  "jobTitle": "Software Engineer",
  "description": "{{ site.Params.description }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Hanoi",
    "addressCountry": "VN"
  },
  "email": "hi@hoanghiep.dev",
  "sameAs": [
    "https://github.com/hiepnh610"
  ]
}
</script>
