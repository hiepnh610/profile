baseURL: 'https://hoanghiep.dev/'
locale: 'en-us'
title: 'Hiep Nguyen'

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # gates GA4 + Fingerprint in layouts/partials/analytics.html
  googleAnalytics: 'G-B7WM914B75'
  fingerprintPublicKey: 'wvM86WQROgppWTepFAFr'
  description: "Personal blog — thoughts on software engineering and things I'm building."
  author: 'Hiep Nguyen'

# JSON output enables Fuse.js search (layouts/index.json)
outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML in Markdown
  highlight:
    noClasses: false # use external CSS (customisable)
    codeFences: true
    guessSyntax: true
    style: dracula

taxonomies:
  tag: tags
